name: Mettre à jour le site Isac

on:
  schedule:
    - cron: '0 5 * * *' # Tous les jours à 5h00 UTC
  workflow_dispatch: # Permet de lancer le script manuellement depuis GitHub

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Lancer la mise à jour (mode headless)
        run: |
          python update.py --headless

      - name: Sauvegarder les changements sur GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.io"
          git add site/
          git diff --staged --quiet || (git commit -m "Mise à jour automatique du site (5h du matin)" && git push)
