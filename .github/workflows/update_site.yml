name: Mettre à jour le site Isac

on:
  schedule:
    - cron: '15 8 * * *'   # 8h15 UTC, juste après le changement du butin
    - cron: '15 9 * * *'   # 9h15 UTC, au cas où ProtoTrack soit en retard
    - cron: '0 12 * * *'   # 12h00 UTC
    - cron: '0 18 * * *'   # 18h00 UTC
  workflow_dispatch: # Permet de lancer le script manuellement depuis GitHub

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Lancer la mise à jour (mode headless)
        run: |
          python update.py --headless

      - name: Sauvegarder les changements sur GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/
          git diff --staged --quiet || (git commit -m "Mise à jour automatique du site" && git push)
